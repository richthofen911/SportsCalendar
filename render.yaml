# Render Blueprint for the Sports Calendar.
#
# Render runs the web service; the database lives on Neon, not here.
#
# The service name below matches the live one so that applying this Blueprint
# adopts it rather than creating a duplicate. What matters most is that it has
# the four `sync: false` values set in the dashboard:
#
#   DATABASE_URL          pooled Neon connection string  (`neon env pull`)
#   REFRESH_TOKEN         shared with the Neon refresh Function
#   REFRESH_FUNCTION_URL  the Neon refresh Function's URL (`neon functions get refresh`)
#   REQUIRE_DATABASE      "true"
#
# Without DATABASE_URL the service serves the committed snapshot instead of the
# database, which is how a finished match kept reading "HT". tools/serve.mjs now
# treats Render as requiring a database, so that state fails its health check.
#
# `ohio` is Render's aws-us-east-2 region, the same one the Neon project is in,
# so queries do not cross the country.
services:
  - type: web
    # Must match the live service, or applying this Blueprint creates a second
    # one instead of adopting the existing deployment.
    name: sportscalendar-da1q
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Serving stale committed files must not look like success.
      - key: REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      # Read from the database at most once every 30s per instance.
      - key: SNAPSHOT_TTL_MS
        value: "30000"
      # Shared secret between this service and the Neon refresh Function.
      # The same value is already in `.env.local` (git-ignored) and on the
      # deployed function; paste it here. Rotate it by changing all three.
      - key: REFRESH_TOKEN
        sync: false
      - key: REFRESH_FUNCTION_URL
        sync: false
