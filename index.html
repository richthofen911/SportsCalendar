<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13151a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fixtures" />
    <title>Sports Calendar — 2026-27 fixtures</title>
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --ink: #1b1d21;
        --muted: #6b7280;
        --line: #e2e2dd;
        --today: #1b1d21;
        --radius: 10px;
        --win: #16a34a;
        --loss: #dc2626;
        --draw: #ca8a04;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13151a;
          --panel: #1b1e24;
          --ink: #eef0f3;
          --muted: #98a1ae;
          --line: #2a2e36;
          --today: #eef0f3;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        align-items: baseline;
        padding: 18px 22px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; }
      h1 .season { color: var(--muted); font-weight: 500; margin-left: 6px; }
      .meta { color: var(--muted); font-size: 12.5px; }
      .meta a { color: inherit; }
      .grow { flex: 1 1 auto; }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 12px 22px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip {
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        border-radius: 999px;
        padding: 4px 11px 4px 9px;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .chip .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--c, #888);
        box-shadow: 0 0 0 1px rgba(0,0,0,.18) inset;
      }
      .chip[aria-pressed="true"] { background: var(--c); border-color: transparent; color: #fff; }
      .chip[aria-pressed="true"] .dot { background: rgba(255,255,255,.9); }
      select, input[type="search"] {
        font: inherit; font-size: 12.5px;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: inherit;
      }
      input[type="search"] { min-width: 170px; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button {
        font: inherit; font-size: 12.5px; padding: 5px 11px; border: 0;
        background: transparent; color: var(--muted); cursor: pointer;
      }
      .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
      .nav { display: inline-flex; align-items: center; gap: 6px; }
      .nav button {
        font: inherit; font-size: 13px; padding: 4px 10px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--bg); color: inherit; cursor: pointer;
      }
      .nav .label { font-weight: 600; min-width: 132px; text-align: center; }

      summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
      .ics { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 0; }
      .ics a { font-size: 12.5px; color: var(--muted); }

      main { padding: 16px 22px 60px; }
      .tally { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .pill {
        border: 1px solid var(--line); background: var(--panel); color: inherit;
        border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer;
      }

      .dows { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
      .dows div { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding-left: 2px; }
      .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
      .cell {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        min-height: 104px;
        padding: 6px 7px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cell.out { opacity: .38; }
      .cell .d { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
      .cell.now .d b {
        background: var(--today); color: var(--bg);
        width: 19px; height: 19px; border-radius: 50%;
        display: grid; place-items: center; font-size: 11.5px;
      }
      .ev {
        border: 0; border-left: 3px solid var(--c, #888); border-radius: 5px;
        background: color-mix(in srgb, var(--c) 12%, var(--panel));
        color: inherit; text-align: left; cursor: pointer;
        font: inherit; font-size: 11.5px; line-height: 1.35;
        padding: 3px 6px; display: block; width: 100%;
      }
      .ev .t { color: var(--muted); font-variant-numeric: tabular-nums; }
      .ev .x { font-weight: 600; }
      .ev.win { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--win) 60%, transparent); }
      .ev.loss { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--loss) 60%, transparent); }
      .ev.draw { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--draw) 55%, transparent); }
      .more { font-size: 11px; color: var(--muted); background: none; border: 0; cursor: pointer; text-align: left; padding: 0 2px; }

      .list { display: flex; flex-direction: column; gap: 18px; }
      .list h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .todayMark {
        background: var(--ink);
        color: var(--bg);
        font-size: 11px;
        letter-spacing: .08em;
        text-transform: uppercase;
        padding: 3px 12px;
      }
      /* standings replaces the calendar, so calendar-only controls step out */
      :root[data-panel="standings"] #statusSeg,
      :root[data-panel="standings"] #compSelect,
      :root[data-panel="standings"] #search,
      :root[data-panel="standings"] #monthNav,
      :root[data-panel="standings"] #clubChips { display: none; }
      /* the month nav gets an inline display from syncLayoutButtons */
      :root[data-panel="standings"] #monthNav { display: none !important; }

      .league { margin-bottom: 22px; }
      .league h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
      .league h3 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
      .tbl { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; font-variant-numeric: tabular-nums; }
      .tbl th, .tbl td { padding: 6px 9px; text-align: right; border-bottom: 1px solid var(--line); font-size: 13px; }
      .tbl th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
      .tbl th:nth-child(2), .tbl td.team { text-align: left; }
      .tbl tr.tracked td { font-weight: 600; }
      .tbl tr.tracked td.team { box-shadow: inset 3px 0 0 var(--c); }
      .tbl .pos { color: var(--muted); width: 30px; }
      .tbl td.pts { font-weight: 700; }
      .tbl tr:last-child td { border-bottom: 0; }

      .rows { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
      .row, .rhead {
        display: grid;
        grid-template-columns: 138px minmax(210px, 1.5fr) minmax(150px, 1fr) 128px 76px minmax(150px, 1fr);
        gap: 10px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        align-items: baseline;
      }
      .row { font-size: 13px; cursor: pointer; }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: color-mix(in srgb, var(--ink) 5%, var(--panel)); }
      .rhead { color: var(--muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
      .c-when { white-space: nowrap; font-variant-numeric: tabular-nums; }
      .c-score { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
      .cbadge { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 6px; }
      .tbc { color: var(--muted); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
      .ground { color: var(--muted); font-size: 11.5px; }

      .drawer {
        position: fixed; inset: 0 auto 0 0; width: min(430px, 92vw);
        background: var(--panel); border-left: 1px solid var(--line);
        box-shadow: -12px 0 30px rgba(0,0,0,.16);
        padding: 18px 20px; overflow: auto; z-index: 10;
      }
      .drawer[hidden] { display: none; }
      .drawer h2 { margin: 0 0 4px; font-size: 16px; }
      .drawer .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
      .drawer dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px 10px; }
      .drawer dt { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px; }
      .drawer dd { margin: 0; font-size: 13.5px; }
      .drawer .close { float: right; border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 8px; padding: 3px 9px; cursor: pointer; }
      .backdrop { position: fixed; inset: 0; background: rgba(10,12,16,.35); z-index: 9; }
      .backdrop[hidden] { display: none; }
      .empty { color: var(--muted); padding: 40px 0; text-align: center; }
      .notice { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
      .refresh {
        border: 1px solid var(--line); background: var(--bg); color: inherit;
        border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
      }
      .refresh[hidden] { display: none; }
      .refresh[disabled] { opacity: .6; cursor: progress; }

      /* Phone layout. Applied as a class by JS (see applyLayout) so it tracks
         the device rather than only the window width, and can be overridden
         from the header on any screen. */
      .phone header { padding: 14px 14px 12px; gap: 8px 14px; }
      .phone h1 { font-size: 16px; }
      .phone main { padding: 12px 12px calc(28px + env(safe-area-inset-bottom)); }
      .phone .controls { padding: 8px 12px; gap: 8px; }
      .phone .tally { font-size: 12px; }
      .phone .grow { display: none; }

      /* club chips scroll sideways instead of eating half the screen */
      .phone .chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        width: 100%;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .phone .chips::-webkit-scrollbar { display: none; }
      .phone .chip { flex: 0 0 auto; padding: 7px 12px; font-size: 13px; }
      .phone select,
      .phone input[type="search"],
      .phone .nav button,
      .phone .refresh { font-size: 13px; padding: 7px 10px; }
      .phone .seg button { font-size: 12px; padding: 7px 7px; }
      .phone input[type="search"] { flex: 1 1 140px; min-width: 0; }

      /* three compact rows: clubs · filters · toggles */
      /* no flex-grow: a growing input would fill the line and push the next
         control onto its own row */
      .phone #compSelect { order: 1; flex: 0 1 128px; min-width: 0; }
      .phone #search { order: 2; flex: 0 1 108px; min-width: 0; }
      .phone #tzSeg { order: 3; flex: 0 0 auto; }
      .phone #statusSeg { order: 4; flex: 0 0 auto; }
      .phone #layoutSeg { order: 5; flex: 0 0 auto; }
      .phone .nav { order: 6; width: 100%; justify-content: space-between; }
      .phone .nav .label { min-width: 0; flex: 1; }

      /* the month grid needs roughly 700px to stay legible */
      .phone #monthNav { display: none !important; }

      /* agenda becomes a card per fixture */
      .phone .rhead { display: none; }
      .phone .row {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "when    score"
          "fixture fixture"
          "comp    clubs"
          "venue   venue";
        gap: 2px 10px;
        padding: 13px 14px;
        min-height: 44px;
      }
      .phone .c-when { grid-area: when; font-weight: 600; }
      .phone .c-fixture { grid-area: fixture; font-size: 15px; margin-top: 2px; }
      .phone .c-comp { grid-area: comp; color: var(--muted); font-size: 12.5px; }
      .phone .c-clubs { grid-area: clubs; text-align: right; font-size: 12.5px; }
      .phone .c-score { grid-area: score; text-align: right; font-size: 15px; }
      .phone .c-venue { grid-area: venue; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
      .phone .dash { display: none; }

      /* the detail panel becomes a bottom sheet */
      .phone .drawer {
        inset: auto 0 0 0;
        width: auto;
        max-height: 86vh;
        border-left: 0;
        border-top: 1px solid var(--line);
        border-radius: 14px 14px 0 0;
        padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
        box-shadow: 0 -12px 30px rgba(0, 0, 0, .2);
      }
      .phone .drawer dl { grid-template-columns: 84px 1fr; }
      /* a nine-column table will not fit a phone: keep the decisive numbers */
      .phone .hide-sm { display: none; }
      .phone .tbl th, .phone .tbl td { padding: 7px 8px; font-size: 13px; }
      .phone .league h3 { font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sports Calendar<span class="season" id="seasonLabel"></span></h1>
      <div class="meta" id="metaLine"></div>
      <div class="grow"></div>
      <button class="refresh" id="refreshBtn" hidden>Refresh data</button>
      <details>
        <summary>Calendar files (.ics)</summary>
        <div class="ics" id="icsLinks"></div>
      </details>
    </header>

    <div class="controls">
      <div class="seg" id="panelSeg" role="group" aria-label="Panel">
        <button id="pCalendar" aria-pressed="true">Calendar</button>
        <button id="pStandings" aria-pressed="false">Standings</button>
      </div>
      <div class="chips" id="categoryChips"></div>
      <div class="chips" id="clubChips"></div>
      <select id="compSelect" aria-label="Competition"></select>
      <div class="seg" id="statusSeg" role="group" aria-label="Status">
        <button id="stUpcoming" aria-pressed="true">Upcoming</button>
        <button id="stPlayed" aria-pressed="false">Played</button>
        <button id="stAll" aria-pressed="false">All</button>
      </div>
      <input type="search" id="search" placeholder="search…" aria-label="Search opponent, venue or competition" title="Search opponent, venue or competition" />
      <div class="seg" id="layoutSeg" role="group" aria-label="Layout">
        <button id="lAuto" aria-pressed="true" title="Phone layout on a phone, month on a desktop">Auto</button>
        <button id="lMonth" aria-pressed="false">Month</button>
        <button id="lAgenda" aria-pressed="false">List</button>
        <button id="lPhone" aria-pressed="false" title="Cards, bottom sheet, compact controls">Phone</button>
      </div>
      <div class="seg" id="tzSeg" role="group" aria-label="Time zone">
        <button id="tzLocal" aria-pressed="true">Local</button>
        <button id="tzUtc" aria-pressed="false">UTC</button>
      </div>
      <div class="grow"></div>
      <div class="nav" id="monthNav">
        <button id="prev" title="Previous month">‹</button>
        <span class="label" id="monthLabel"></span>
        <button id="next" title="Next month">›</button>
        <button id="today">Today</button>
      </div>
    </div>

    <main>
      <p class="tally" id="tally"></p>
      <div id="view"></div>
    </main>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden></aside>

    <script src="data/calendar.js"></script>
    <script>
      const DATA = window.CALENDAR_DATA;
      const CLUBS = Object.fromEntries(DATA.clubs.map((c) => [c.id, c]));
      const CATS = Object.fromEntries(DATA.categories.map((c) => [c.id, c]));
      const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const DOWS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
      const LAYOUTS = { lAuto: "auto", lMonth: "month", lAgenda: "agenda", lPhone: "phone" };
      const NOISE = new Set(["fc","cf","afc","ac","sc","fk","sk","cp","if","ca","club","de","the","04","05","09","1899","1900","1907","2004"]);

      // Phones, including landscape ones that are wider than the grid needs.
      const PHONE_QUERY = "(max-width: 820px), (pointer: coarse) and (max-width: 1100px)";
      const phoneMq = window.matchMedia(PHONE_QUERY);

      const store = {
        get(key) {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        },
        set(key, value) {
          try {
            localStorage.setItem(key, value);
          } catch {
            /* private mode or file:// — the choice just won't persist */
          }
        },
      };

      // Earlier builds stored "desktop"/"phone" for a separate layout axis.
      function migrateLayout(stored) {
        if (stored === "desktop") return "month";
        if (stored === "list") return "agenda";
        return Object.values(LAYOUTS).includes(stored) ? stored : "auto";
      }

      const state = {
        layout: migrateLayout(store.get("sc-layout")),
        view: "month",
        status: "upcoming",
        tz: "local",
        clubs: new Set(DATA.clubs.map((c) => c.id)),
        categories: new Set(store.get("sc-cats") ? store.get("sc-cats").split(",").filter((c) => c in CATS) : DATA.categories.map((c) => c.id)),
        panel: store.get("sc-panel") === "standings" ? "standings" : "calendar",
        competition: "all",
        q: "",
        day: null,
        ym: null,
        anchorKey: null,
        anchorMark: false,
      };

      function push(map, key, value) {
        const list = map.get(key);
        if (list) list.push(value);
        else map.set(key, [value]);
      }

      // ---- identity helpers (mirror tools/parse.mjs) ----
      function slug(name) {
        return String(name || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .replace(/\./g, "")
          .replace(/[^a-z0-9]+/g, " ")
          .split(" ")
          .filter((t) => t.length > 1 && !NOISE.has(t))
          .join(" ");
      }
      const ALIAS_SLUGS = Object.fromEntries(
        DATA.clubs.map((c) => [c.id, (c.aliases || [c.name]).map(slug)])
      );
      function sideOf(match, clubId) {
        const keys = ALIAS_SLUGS[clubId] || [];
        const h = slug(match.homeTeam);
        const a = slug(match.awayTeam);
        const hit = (k, side) => (k === side || side.startsWith(k) || side.endsWith(k) ? true : false);
        if (keys.some((k) => hit(k, h))) return "home";
        if (keys.some((k) => hit(k, a))) return "away";
        return null;
      }

      // ---- one entry per fixture, even when two tracked clubs feature ----
      const fixtureMap = new Map();
      for (const m of DATA.events.filter((e) => e.category === "football")) {
        const key = m.fixtureKey || m.id;
        const found = fixtureMap.get(key);
        if (found) {
          if (!found.clubs.includes(m.club)) found.clubs.push(m.club);
          continue;
        }
        fixtureMap.set(key, { ...m, clubs: [m.club] });
      }
      const races = DATA.events
        .filter((e) => e.category === "formula-1")
        .map((e) => ({ ...e, clubs: [], fixtureKey: e.id }));
      const fixtures = [...fixtureMap.values(), ...races];
      const entryByKey = new Map(fixtures.map((f) => [f.fixtureKey, f]));
      const sortKeyOf = (m) => m.kickoffUtc || `${m.date} 99:99`;
      fixtures.sort((a, b) => (sortKeyOf(a) < sortKeyOf(b) ? -1 : sortKeyOf(a) > sortKeyOf(b) ? 1 : 0));

      // ---- time rendering ----
      function utcDate(m) {
        return m.kickoffUtc ? new Date(m.kickoffUtc) : null;
      }
      // Kick-offs are stored in UTC; for the local view shift to wall-clock.
      function localised(m) {
        const d = utcDate(m);
        if (!d) return null;
        // For the UTC view, shift the instant so local getters read back UTC fields.
        return state.tz === "utc" ? new Date(d.getTime() + d.getTimezoneOffset() * 60000) : d;
      }
      function localZoneId() {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
      }
      function shown(m) {
        return localised(m) || new Date(`${m.date}T12:00:00`);
      }
      function clockOf(m) {
        const d = localised(m);
        if (!d) return "";
        return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      }
      function dayKeyOf(m) {
        return keyOf(shown(m));
      }
      function keyOf(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }
      function zoneLabel() {
        return state.tz === "utc" ? "UTC" : localZoneId().split("/").pop().replace(/_/g, " ");
      }
      // Shows the UTC instant the source gave plus the same moment locally.
      function utcLine(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        const local = `${DOWS[(d.getDay() + 6) % 7]} ${d.getDate()} ${MONTHS[d.getMonth()]}, ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
        return `${iso} · ${local} ${zoneLabel()}`;
      }
      function longWhen(m) {
        const d = shown(m);
        const wd = DOWS[(d.getDay() + 6) % 7];
        const date = `${wd} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
        return clockOf(m) ? `${date}, ${clockOf(m)} ${zoneLabel()}` : `${date} — kick-off time not yet confirmed`;
      }

      // ---- derived display values ----
      function label(m, side) {
        const name = side === "home" ? m.homeTeam : m.awayTeam;
        for (const id of m.clubs) {
          if (sideOf(m, id) === side) return CLUBS[id].short;
        }
        return trimName(name);
      }
      function trimName(name) {
        return slug(name).replace(/\b\w/g, (c) => c.toUpperCase()).split(" ").slice(0, 2).join(" ");
      }
      function resultClass(m) {
        if (!m.score || m.clubs.length !== 1) return "";
        const id = m.clubs[0];
        const [h, a] = m.score.split("-").map(Number);
        const mine = sideOf(m, id) === "home" ? h : a;
        const theirs = sideOf(m, id) === "home" ? a : h;
        return mine > theirs ? "win" : mine < theirs ? "loss" : "draw";
      }

      // ---- category-aware accessors ----
      function eventTitle(m) {
        return m.category === "formula-1" ? m.name : `${m.homeTeam} v ${m.awayTeam}`;
      }
      function eventCompetition(m) {
        return m.category === "formula-1" ? "Formula 1" : m.competition;
      }
      function eventVenue(m) {
        if (m.category === "formula-1") return [m.circuit, m.location, m.country].filter(Boolean).join(", ");
        return [m.venue, m.location].filter(Boolean).join(", ");
      }
      function eventColor(m) {
        return m.category === "formula-1"
          ? CATS["formula-1"].color
          : CLUBS[m.clubs[0]]?.color || "#888";
      }
      function eventShort(m) {
        if (m.category !== "formula-1") return null;
        return `${trimName(m.name.replace(/\s*Grand Prix$/i, ""))} GP`;
      }
      function raceResult(m) {
        return m.category === "formula-1" && m.winner ? trimName(m.winner) : null;
      }
      function eventLine(m) {
        if (m.category === "formula-1") return `${eventShort(m)}${m.winner ? ` — ${trimName(m.winner)}` : ""}`;
        return m.score ? `${label(m, "home")} ${m.score} ${label(m, "away")}` : `${label(m, "home")} v ${label(m, "away")}`;
      }

      // ---- filtering ----
      function visible() {
        const q = state.q.trim().toLowerCase();
        return fixtures.filter((m) => {
          if (!state.categories.has(m.category)) return false;
          if (m.category === "football" && !m.clubs.some((c) => state.clubs.has(c))) return false;
          if (state.competition !== "all" && eventCompetition(m) !== state.competition) return false;
          if (state.status === "upcoming" && m.status !== "upcoming") return false;
          if (state.status === "played" && m.status !== "played") return false;
          if (state.day && dayKeyOf(m) !== state.day) return false;
          if (q) {
            const hay = `${eventTitle(m)} ${eventCompetition(m)} ${eventVenue(m)} ${m.location || ""} ${m.round || ""}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

      // Open on the first month that actually has something to show:
      // today if it still has fixtures, otherwise the next one due.
      function defaultMonth() {
        const now = Date.now();
        const today = keyOf(new Date()).slice(0, 7);
        const pool =
          state.status === "upcoming"
            ? fixtures.filter((m) => m.status === "upcoming")
            : state.status === "played"
              ? fixtures.filter((m) => m.status === "played")
              : fixtures;
        if (pool.some((m) => dayKeyOf(m).startsWith(today))) return today;
        // Nearest in time, so Played opens on the latest results rather than August.
        const near = pool.reduce(
          (best, m) => {
            const at = utcDate(m) ? utcDate(m).getTime() : Date.parse(`${m.date}T12:00:00`);
            const gap = Math.abs(at - now);
            return !best || gap < best.gap ? { m, gap } : best;
          },
          null
        );
        return near ? dayKeyOf(near.m).slice(0, 7) : today;
      }

      // ---- rendering ----
      // Played and All read from "now" backwards, so land on today rather than
      // on the opening fixtures of the season.
      function anchorsToToday() {
        return state.status === "played" || state.status === "all";
      }

      function render({ anchor = false } = {}) {
        document.documentElement.dataset.panel = state.panel;
        for (const el of document.querySelectorAll("#clubChips .chip")) {
          el.setAttribute("aria-pressed", String(state.clubs.has(el.dataset.club)));
        }
        for (const el of document.querySelectorAll("#categoryChips .chip")) {
          el.setAttribute("aria-pressed", String(state.categories.has(el.dataset.category)));
        }
        if (state.panel === "standings") {
          document.getElementById("view").innerHTML = standingsHtml();
          document.getElementById("tally").innerHTML =
            `${DATA.standings.length} league tables · computed from each season's results · refreshed ${DATA.generatedAt.slice(0, 10)}`;
          return;
        }
        if (!state.ym) state.ym = defaultMonth();
        const rows = visible();
        const at = anchor && anchorsToToday() && state.view === "list" ? anchorFixture(rows) : null;
        state.anchorKey = at?.key || null;
        state.anchorMark = at?.mark || false;
        renderTally(rows);
        const [y, mo] = state.ym.split("-").map(Number);
        document.getElementById("monthLabel").textContent = `${MONTHS[mo - 1]} ${y}`;
        document.getElementById("view").innerHTML = state.view === "month" ? monthHtml(rows) : listHtml(rows);
        bindClicks();
        // A deliberate navigation always settles the scroll: on today when the
        // filter reads from now, otherwise back at the top.
        if (anchor) {
          if (state.anchorKey) revealAnchor();
          else window.scrollTo({ top: 0, behavior: "auto" });
        }
      }

      // The first fixture on or after today; if every row is already played, the
      // most recent one — and no marker, since nothing there is "today".
      function anchorFixture(rows) {
        const todayKey = keyOf(new Date());
        const next = rows.find((m) => dayKeyOf(m) >= todayKey);
        if (next) return { key: next.fixtureKey, mark: true };
        const last = rows[rows.length - 1];
        return last ? { key: last.fixtureKey, mark: false } : null;
      }

      function revealAnchor() {
        const sticky = document.querySelector(".controls").getBoundingClientRect().height;
        const mark = document.querySelector(".todayMark");
        if (mark) {
          window.scrollTo({ top: Math.max(0, mark.getBoundingClientRect().top + window.scrollY - sticky), behavior: "auto" });
          return;
        }
        for (const el of document.querySelectorAll(".row")) {
          if (el.dataset.fixture !== state.anchorKey) continue;
          const top = el.getBoundingClientRect().top + window.scrollY - sticky - 10;
          window.scrollTo({ top: Math.max(0, top), behavior: "auto" });
          return;
        }
      }

      function renderTally(rows) {
        const upcoming = rows.filter((m) => m.status === "upcoming").length;
        const played = rows.filter((m) => m.status === "played").length;
        const tbc = rows.filter((m) => !m.kickoffUtc).length;
        const parts = [
          `${rows.length} fixtures`,
          `${upcoming} upcoming`,
          `${played} played`,
          tbc ? `${tbc} kick-off TBC` : "",
          `times in ${zoneLabel()}`,
        ].filter(Boolean);
        const dayPill = state.day
          ? `<button class="pill" id="clearDay">only ${state.day.slice(8)} ${MONTHS[Number(state.day.slice(5, 7)) - 1]} ✕</button>`
          : "";
        document.getElementById("tally").innerHTML = `${parts.join(" · ")} ${dayPill}`;
      }

      function monthHtml(rows) {
        const [y, mo] = state.ym.split("-").map(Number);
        const bucket = new Map();
        for (const m of rows) push(bucket, dayKeyOf(m), m);
        const first = new Date(y, mo - 1, 1);
        const offset = (first.getDay() + 6) % 7;
        const days = new Date(y, mo, 0).getDate();
        const todayKey = keyOf(new Date());
        const cells = [];
        for (let i = offset; i > 0; i--) cells.push(cellHtml(new Date(y, mo - 1, 1 - i), bucket, true, todayKey));
        for (let d = 1; d <= days; d++) cells.push(cellHtml(new Date(y, mo - 1, d), bucket, false, todayKey));
        let tail = 1;
        while (cells.length % 7) cells.push(cellHtml(new Date(y, mo, tail++), bucket, true, todayKey));
        const inMonth = rows.filter((m) => dayKeyOf(m).startsWith(state.ym)).length;
        let notice = "";
        if (!inMonth) {
          const elsewhere = rows.find((m) => dayKeyOf(m).slice(0, 7) !== state.ym);
          notice = rows.length
            ? `<div class="notice">Nothing in ${MONTHS[mo - 1]} ${y} with these filters. ` +
              (elsewhere
                ? `<button class="pill" data-jump="${dayKeyOf(elsewhere).slice(0, 7)}">Jump to ${MONTHS[Number(dayKeyOf(elsewhere).slice(5, 7)) - 1]}</button>`
                : "") +
              `</div>`
            : `<div class="empty">No fixtures match these filters.</div>`;
        }
        return `${notice}<div class="dows">${DOWS.map((d) => `<div>${d}</div>`).join("")}</div><div class="grid">${cells.join("")}</div>`;
      }

      function cellHtml(d, bucket, outside, todayKey) {
        const k = keyOf(d);
        const list = bucket.get(k) || [];
        const head = `<div class="d"><b>${d.getDate()}</b><span>${DOWS[(d.getDay() + 6) % 7]}</span></div>`;
        if (!list.length) return `<div class="cell${outside ? " out" : ""}">${head}</div>`;
        const chips = list.slice(0, 3).map(chipHtml).join("");
        const more = list.length > 3 ? `<button class="more" data-day="${k}">+${list.length - 3} more</button>` : "";
        return `<div class="cell${outside ? " out" : ""}${k === todayKey ? " now" : ""}">${head}${chips}${more}</div>`;
      }

      function chipHtml(m) {
        const time = clockOf(m) || "—";
        const ground = m.category === "football" && m.clubs.length === 1 ? ` ${sideOf(m, m.clubs[0]) === "home" ? "H" : "A"}` : "";
        return `<button class="ev ${resultClass(m)}" style="--c:${eventColor(m)}" data-fixture="${m.fixtureKey}"
          title="${eventCompetition(m)} · ${eventTitle(m)}">
          <span class="t">${time}${ground}</span> <span class="x">${eventLine(m)}</span>${m.kickoffUtc ? "" : ' <span class="t">TBC</span>'}
        </button>`;
      }

      function listHtml(rows) {
        if (!rows.length) return `<div class="empty">No fixtures match these filters.</div>`;
        const groups = new Map();
        for (const m of rows) push(groups, dayKeyOf(m).slice(0, 7), m);
        return `<div class="list">${[...groups].map(([k, list]) => {
          const [y, mo] = k.split("-").map(Number);
          return `<section><h3>${MONTHS[mo - 1]} ${y} · ${list.length} fixture${list.length === 1 ? "" : "s"}</h3>${tableHtml(list)}</section>`;
        }).join("")}</div>`;
      }

      function tableHtml(list) {
        const head = `<div class="rhead"><span>Kick-off</span><span>Fixture</span><span>Competition</span><span>Your clubs</span><span>Result</span><span>Venue</span></div>`;
        const rows = list
          .map((m) => {
            const badges = m.clubs
              .map((id) => `<span class="cbadge" style="--c:${CLUBS[id].color}" title="${CLUBS[id].name}"></span>`)
              .join("");
            const grounds =
              m.category === "formula-1"
                ? `<span class="cbadge" style="--c:${CATS["formula-1"].color}"></span>F1`
                : m.clubs.map((id) => `${CLUBS[id].short} ${sideOf(m, id) === "home" ? "(H)" : "(A)"}`).join(", ");
            const d = shown(m);
            const when = `${String(d.getDate()).padStart(2, "0")} ${MONTHS[d.getMonth()].slice(0, 3)} ${clockOf(m) || ""}${
              m.kickoffUtc ? "" : '<span class="tbc">TBC</span>'}`;
            const mark =
              m.fixtureKey === state.anchorKey && state.anchorMark ? `<div class="todayMark">Today</div>` : "";
            return `${mark}<div class="row" data-fixture="${m.fixtureKey}">
              <span class="c-when">${when}</span>
              <span class="c-fixture">${eventTitle(m)}</span>
              <span class="c-comp">${eventCompetition(m)}${m.phase ? ` <span class="ground">· ${m.phase}</span>` : ""}${m.round ? ` <span class="ground">· ${m.category === "formula-1" ? "round" : "rd"} ${m.round}</span>` : ""}</span>
              <span class="c-clubs">${badges}${grounds}</span>
              <span class="c-score">${raceResult(m) ?? (m.score ? `${m.score}${m.scoreExtra ? ` ${m.scoreExtra}` : ""}` : '<i class="dash">—</i>')}</span>
              <span class="c-venue">${eventVenue(m) || "—"}</span>
            </div>`;
          })
          .join("");
        return `<div class="rows">${head}${rows}</div>`;
      }

      function drawerHtml(m) {
        // The heading already carries the fixture, date and time.
        const rows = [];
        if (m.category === "formula-1") {
          rows.push(["Round", `${m.round} of ${races.length}`]);
          if (m.circuit) rows.push(["Circuit", [m.circuit, m.location, m.country].filter(Boolean).join(", ")]);
          if (m.weekendStartUtc) rows.push(["Weekend opens", utcLine(m.weekendStartUtc)]);
          if (m.kickoffUtc) rows.push(["Race start", utcLine(m.kickoffUtc)]);
          if (m.winner) {
            rows.push(["Winner", `${m.winner}${m.winningConstructor ? ` — ${m.winningConstructor}` : ""}`]);
            if (m.pole) rows.push(["Pole position", m.pole]);
            if (m.fastestLap) rows.push(["Fastest lap", m.fastestLap]);
          }
          if (m.report) rows.push(["Report", `<a href="${m.report}" target="_blank" rel="noopener">race report</a>`]);
          rows.push(["Source", `Wikipedia calendar, start times from ESPN — ${m.sourcePage}`]);
          return `<button class="close" id="drawerClose">close</button>
            <h2>${m.name}</h2>
            <div class="sub">Formula 1 · round ${m.round} · ${longWhen(m)}</div>
            <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
        }
        rows.push(["Competition", `${m.competition}${m.phase ? ` — ${m.phase}` : ""}${m.round ? ` · round ${m.round}` : ""}`]);
        if (m.kickoffUtc) rows.push(["UTC", m.kickoffUtc + (m.localClock ? ` (venue clock ${m.localClock})` : "")]);
        if (m.timeConfidence === "assumed") rows.push(["Time note", "zone inferred from the venue"]);
        rows.push([
          "Your clubs",
          m.clubs.map((id) => `${CLUBS[id].name} — ${sideOf(m, id) === "home" ? "home" : "away"}`).join("<br>"),
        ]);
        if (m.score) rows.push(["Result", `${m.homeTeam} ${m.score.replace("-", "–")} ${m.awayTeam}${m.scoreExtra ? ` (${m.scoreExtra})` : ""}`]);
        if (m.homeEvents) rows.push([m.homeTeam, m.homeEvents]);
        if (m.awayEvents) rows.push([m.awayTeam, m.awayEvents]);
        if (m.venue) rows.push(["Venue", [m.venue, m.location].filter(Boolean).join(", ")]);
        if (m.attendance) rows.push(["Attendance", Number(m.attendance).toLocaleString()]);
        if (m.referee) rows.push(["Referee", m.referee]);
        if (m.notes) rows.push(["Note", m.notes]);
        if (m.report) rows.push(["Report", `<a href="${m.report}" target="_blank" rel="noopener">official match page</a>`]);
        rows.push(["Source", `Wikipedia — ${m.sourcePage}`]);
        const title = m.score ? `${m.homeTeam} ${m.score} ${m.awayTeam}` : `${m.homeTeam} v ${m.awayTeam}`;
        return `<button class="close" id="drawerClose">close</button>
          <h2>${title}</h2>
          <div class="sub">${m.competition}${m.round ? ` · round ${m.round}` : ""} · ${longWhen(m)}</div>
          <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
      }

      function bindClicks() {
        for (const el of document.querySelectorAll("[data-fixture]")) {
          el.addEventListener("click", () => {
            const m = entryByKey.get(el.dataset.fixture);
            if (!m) return;
            const d = document.getElementById("drawer");
            d.innerHTML = drawerHtml(m);
            d.hidden = false;
            document.getElementById("backdrop").hidden = false;
            document.getElementById("drawerClose").addEventListener("click", closeDrawer);
          });
        }
        for (const el of document.querySelectorAll("[data-day]")) {
          el.addEventListener("click", () => {
            state.day = el.dataset.day;
            state.layout = "agenda";
            applyLayout();
            render();
          });
        }
        for (const el of document.querySelectorAll("[data-jump]")) {
          el.addEventListener("click", () => {
            state.ym = el.dataset.jump;
            render();
          });
        }
        const clear = document.getElementById("clearDay");
        if (clear)
          clear.addEventListener("click", () => {
            state.day = null;
            render();
          });
      }
      function closeDrawer() {
        document.getElementById("drawer").hidden = true;
        document.getElementById("backdrop").hidden = true;
      }

      // One control carries both axes: Auto, the two desktop views, and the
      // phone layout, whose agenda is a card rendering of the same list.
      function resolve(layout) {
        switch (layout) {
          case "month":
            return { phone: false, view: "month" };
          case "agenda":
            return { phone: false, view: "list" };
          case "phone":
            return { phone: true, view: "list" };
          default:
            return phoneMq.matches ? { phone: true, view: "list" } : { phone: false, view: "month" };
        }
      }

      let appliedKey = null;

      function applyLayout() {
        const { phone, view } = resolve(state.layout);
        document.documentElement.classList.toggle("phone", phone);
        const key = `${phone}|${view}`;
        const changed = key !== appliedKey;
        appliedKey = key;
        state.view = view;
        syncLayoutButtons();
        return changed;
      }

      function setPanel(panel) {
        state.panel = panel;
        store.set("sc-panel", panel);
        document.getElementById("pCalendar").setAttribute("aria-pressed", String(panel === "calendar"));
        document.getElementById("pStandings").setAttribute("aria-pressed", String(panel === "standings"));
        render();
      }

      function standingsHtml() {
        return DATA.standings
          .map((league) => {
            const body = league.rows
              .map((r) => {
                const club = r.clubId ? CLUBS[r.clubId] : null;
                return `<tr class="${club ? "tracked" : ""}"${club ? ` style="--c:${club.color}"` : ""}>
                  <td class="pos">${r.position}</td>
                  <td class="team">${club ? `<span class="cbadge" style="--c:${club.color}"></span>` : ""}${r.team}</td>
                  <td>${r.played}</td>
                  <td class="hide-sm">${r.won}</td>
                  <td class="hide-sm">${r.drawn}</td>
                  <td class="hide-sm">${r.lost}</td>
                  <td class="hide-sm">${r.gf}:${r.ga}</td>
                  <td>${r.gd > 0 ? `+${r.gd}` : r.gd}</td>
                  <td class="pts">${r.points}</td>
                </tr>`;
              })
              .join("");
            return `<section class="league">
              <h3>${league.league} <span>· ${league.rows.length} clubs · ${league.played} matches played${league.updated ? ` · table updated ${league.updated}` : ""}</span></h3>
              <table class="tbl">
                <thead><tr><th class="pos">#</th><th>Club</th><th>Pld</th><th class="hide-sm">W</th><th class="hide-sm">D</th><th class="hide-sm">L</th><th class="hide-sm">GF:GA</th><th>GD</th><th>Pts</th></tr></thead>
                <tbody>${body}</tbody>
              </table>
            </section>`;
          })
          .join("");
      }

      function syncLayoutButtons() {
        for (const [id, value] of Object.entries(LAYOUTS)) {
          document.getElementById(id).setAttribute("aria-pressed", String(state.layout === value));
        }
        document.getElementById("monthNav").style.display = state.view === "month" ? "inline-flex" : "none";
      }

      async function refreshFromServer(btn) {
        btn.disabled = true;
        btn.textContent = "Fetching…";
        try {
          const res = await fetch("/api/refresh", { method: "POST" });
          const body = await res.json();
          if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
          location.reload();
          return;
        } catch (err) {
          btn.textContent = "Refresh failed";
          setTimeout(() => {
            btn.textContent = "Refresh data";
          }, 4000);
          console.error("refresh failed:", err);
        } finally {
          btn.disabled = false;
        }
      }

      function pressPair(offId, onId) {
        document.getElementById(offId).setAttribute("aria-pressed", "false");
        document.getElementById(onId).setAttribute("aria-pressed", "true");
      }

      function buildChrome() {
        document.getElementById("seasonLabel").textContent = ` ${DATA.season}`;
        document.getElementById("metaLine").innerHTML =
          `${fixtures.length} events · ${DATA.categories.map((c) => c.name).join(", ")}<br>` +
          `refreshed ${DATA.generatedAt.slice(0, 16).replace("T", " ")} · source: ${DATA.source}`;
        document.getElementById("icsLinks").innerHTML =
          [`<a href="calendar/all-events.ics" download>everything</a>`]
            .concat(DATA.clubs.map((c) => `<a href="calendar/${c.id}.ics" download>${c.name}</a>`))
            .concat([`<a href="calendar/formula-1.ics" download>Formula 1</a>`])
            .join("");
        document.getElementById("categoryChips").innerHTML = DATA.categories
          .map(
            (c) =>
              `<button class="chip" data-category="${c.id}" style="--c:${c.color}" aria-pressed="${state.categories.has(c.id)}">` +
              `<span class="dot"></span>${c.name}</button>`
          )
          .join("");
        document.getElementById("clubChips").innerHTML = DATA.clubs
          .map(
            (c) =>
              `<button class="chip" data-club="${c.id}" style="--c:${c.color}" aria-pressed="true">` +
              `<span class="dot"></span>${c.name}</button>`
          )
          .join("");
        document.getElementById("compSelect").innerHTML = ["all", ...[...new Set(fixtures.map(eventCompetition))].sort()]
          .map((c) => `<option value="${c}">${c === "all" ? "All competitions" : c}</option>`)
          .join("");
      }

      function wireUp() {
        document.getElementById("categoryChips").addEventListener("click", (e) => {
          const btn = e.target.closest(".chip");
          if (!btn) return;
          const id = btn.dataset.category;
          state.categories.has(id) ? state.categories.delete(id) : state.categories.add(id);
          if (!state.categories.size) DATA.categories.forEach((c) => state.categories.add(c.id));
          store.set("sc-cats", [...state.categories].join(","));
          render();
        });
        document.getElementById("pCalendar").addEventListener("click", () => setPanel("calendar"));
        document.getElementById("pStandings").addEventListener("click", () => setPanel("standings"));
        document.getElementById("clubChips").addEventListener("click", (e) => {
          const btn = e.target.closest(".chip");
          if (!btn) return;
          state.clubs.has(btn.dataset.club) ? state.clubs.delete(btn.dataset.club) : state.clubs.add(btn.dataset.club);
          if (!state.clubs.size) DATA.clubs.forEach((c) => state.clubs.add(c.id));
          render();
        });
        document.getElementById("compSelect").addEventListener("change", (e) => {
          state.competition = e.target.value;
          render();
        });
        const statusButtons = { stUpcoming: "upcoming", stPlayed: "played", stAll: "all" };
        for (const [id, value] of Object.entries(statusButtons)) {
          document.getElementById(id).addEventListener("click", () => {
            state.status = value;
            for (const k of Object.keys(statusButtons)) {
              document.getElementById(k).setAttribute("aria-pressed", String(k === id));
            }
            // Changing what is shown also changes where "now" is.
            state.ym = defaultMonth();
            render({ anchor: true });
          });
        }
        for (const [id, value] of Object.entries(LAYOUTS)) {
          document.getElementById(id).addEventListener("click", () => {
            state.layout = value;
            store.set("sc-layout", value);
            applyLayout();
            render({ anchor: true });
          });
        }
        phoneMq.addEventListener("change", () => {
          if (state.layout !== "auto") return;
          applyLayout();
          render();
        });
        document.getElementById("tzLocal").addEventListener("click", () => {
          state.tz = "local";
          pressPair("tzUtc", "tzLocal");
          render();
        });
        document.getElementById("tzUtc").addEventListener("click", () => {
          state.tz = "utc";
          pressPair("tzLocal", "tzUtc");
          render();
        });
        document.getElementById("search").addEventListener("input", (e) => {
          state.q = e.target.value;
          render();
        });
        document.getElementById("prev").addEventListener("click", () => shiftMonth(-1));
        document.getElementById("next").addEventListener("click", () => shiftMonth(1));
        document.getElementById("today").addEventListener("click", () => {
          const now = new Date();
          state.ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
          render();
        });
        document.getElementById("backdrop").addEventListener("click", closeDrawer);
        const refreshBtn = document.getElementById("refreshBtn");
        // Only meaningful when a server is running; over file:// there is nothing to call.
        if (location.protocol.startsWith("http")) {
          refreshBtn.hidden = false;
          refreshBtn.addEventListener("click", () => refreshFromServer(refreshBtn));
        }
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeDrawer();
          if (e.target.matches("input, select")) return;
          if (e.key === "ArrowLeft") shiftMonth(-1);
          if (e.key === "ArrowRight") shiftMonth(1);
        });
      }

      function shiftMonth(delta) {
        const [y, mo] = state.ym.split("-").map(Number);
        const d = new Date(y, mo - 1 + delta, 1);
        state.ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        render();
      }

      buildChrome();
      wireUp();
      setPanel(state.panel);
      applyLayout();
      render({ anchor: true });
    </script>
  </body>
</html>
